<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="80"/>
    </clipPath>
  </defs>
  <!-- Red top half (Monaco flag) -->
  <rect width="512" height="512" rx="80" fill="#cc0000"/>
  <!-- White bottom half -->
  <rect y="256" width="512" height="256" fill="#ffffff" clip-path="url(#rounded)"/>
  <!-- F1 text: red on white bottom half -->
  <text x="256" y="368" text-anchor="middle" dominant-baseline="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="172" letter-spacing="-6"
        fill="#cc0000">F1</text>
</svg>
