name: CI

on:
  # push had no branch filter, so it fired alongside pull_request on every
  # commit to an open PR (twice per commit) and again on merge to main for
  # nothing. One trigger covers both: PR branches via push, main excluded.
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token; no job here writes to the repo or reads other scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --check build.js
      - run: node --check tools/gen-og-images.js
      - run: node --test
      - run: node build.js

  # Audit of this repo's own workflows; accepted findings are in
  # .github/zizmor.yml.
  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # Single stable name for the org's required-status-check ruleset to point
  # at, regardless of how the real jobs above are split or renamed.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [build, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
