name: CI

on:
  # PR branches only; main has nothing new after merge.
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --check build.js
      - run: node --check tools/gen-og-images.js
      - run: node --test
      - run: node build.js

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [build, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
