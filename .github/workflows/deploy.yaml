name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: drumandbytes/reusable-actions/.github/workflows/deploy-cloudflare-pages.yml@v1
    with:
      project-name: monaco-f1-walk
      # Per-circuit pages are generated from templates/ + circuits/ by build.js,
      # a dependency-free Node script — no package.json needed, so nothing to
      # install. ubuntu-latest ships Node, which is all build.js requires.
      install-dependencies: false
      output-directory: "dist"
      build-command: node build.js
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
