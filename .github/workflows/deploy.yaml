name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: drumandbytes/reusable-actions/.github/workflows/deploy-cloudflare-pages.yml@v1
    with:
      project-name: monaco-f1-walk
      # A hand-written static site: no package.json, so nothing to install, and
      # the sources are published directly rather than a build output.
      install-dependencies: false
      output-directory: "."
      # Stands in for a build step — refreshes the og:article:modified_time
      # stamp so the page reports its real last-updated date.
      build-command: >-
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S+00:00") &&
        sed -i "s|article:modified_time\" content=\"[^\"]*\"|article:modified_time\" content=\"$TIMESTAMP\"|g" index.html
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
