name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: drumandbytes/reusable-actions/.github/workflows/deploy-cloudflare-pages.yml@v1
    with:
      project-name: monaco-f1-walk
      # build.js is dependency-free; the runner's Node is enough.
      install-dependencies: false
      output-directory: "dist"
      build-command: node build.js
      sitemap-artifact: sitemap
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  indexnow:
    needs: deploy
    uses: drumandbytes/reusable-actions/.github/workflows/indexnow.yml@v1
    with:
      host: f1walk.drumandbytes.dev
      key: ${{ vars.INDEXNOW_KEY }}
      sitemap-artifact: sitemap
